<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gallinas y Valientes · Tres demos</title>
<style>
  :root{
    --ink:#1c1214;
    --paper:#fff7ea;
    --wine:#45182d;
    --yellow:#f5c74e;
    --brick:#98242b;
    --serif:Georgia,'Times New Roman',serif;
    --sans:system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:16px/1.3 var(--sans)}
  .hub{min-height:100%;display:grid;grid-template-rows:auto 1fr}
  .mast{
    background:var(--ink);
    color:var(--paper);
    padding:clamp(18px,3vw,36px) clamp(16px,4vw,48px) clamp(14px,2vw,22px);
    border-bottom:1px solid #ffffff22;
  }
  .kicker{
    margin:0 0 6px;
    font-size:11px;
    font-weight:750;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#f4bed7;
  }
  h1{
    margin:0 0 clamp(14px,2vw,22px);
    font:700 clamp(36px,6vw,72px)/.9 var(--serif);
    letter-spacing:-.05em;
  }
  h1 i{font-weight:400;color:var(--yellow)}
  .switch{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
  }
  .switch button{
    appearance:none;
    cursor:pointer;
    min-height:72px;
    padding:12px 16px 14px;
    border:1px solid transparent;
    border-radius:2px;
    text-align:left;
    color:var(--ink);
    font:inherit;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:4px;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .switch button:hover{transform:translateY(-2px)}
  .switch button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
  .switch button b{font:700 clamp(16px,1.6vw,22px)/1.05 var(--serif);letter-spacing:-.03em}
  .switch button span{font-size:12px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;opacity:.72}
  .switch button[data-demo="01"]{background:#f1c5bd;color:var(--wine)}
  .switch button[data-demo="02"]{background:var(--yellow);color:#28172e}
  .switch button[data-demo="03"]{background:var(--brick);color:#fff7e8}
  .switch button[aria-pressed="true"]{
    box-shadow:0 0 0 3px var(--paper), 0 10px 0 #0006;
    transform:translateY(-2px);
  }
  .stage{position:relative;min-height:0;background:#111}
  .stage iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    background:#111;
    display:none;
  }
  .stage iframe.is-on{display:block}
  @media(max-width:720px){
    .mast{padding:12px 12px 10px}
    .kicker{margin-bottom:5px}
    h1{font-size:clamp(25px,7vw,38px);margin-bottom:10px}
    .switch{gap:6px}
    .switch button{min-height:44px;padding:5px 6px;gap:2px}
    .switch button b{font-size:clamp(12px,3.5vw,17px)}
    .switch button span{font-size:10px}
    .switch button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--paper);transform:none}
  }
  .hub{height:100%;height:100dvh}
</style>
</head>
<body>
<div class="hub">
  <header class="mast">
    <p class="kicker">ASTRA · Demo privada</p>
    <h1>Gallinas <i>y</i> Valientes</h1>
    <div class="switch" role="tablist" aria-label="Elegir demo">
      <button type="button" role="tab" id="tab-01" data-demo="01" aria-controls="frame-01" aria-pressed="true">
        <span>01</span><b>Mesa A/B</b>
      </button>
      <button type="button" role="tab" id="tab-02" data-demo="02" aria-controls="frame-02" aria-pressed="false">
        <span>02</span><b>Del gesto a la mesa</b>
      </button>
      <button type="button" role="tab" id="tab-03" data-demo="03" aria-controls="frame-03" aria-pressed="false">
        <span>03</span><b>Desde la mesa</b>
      </button>
    </div>
  </header>
  <div class="stage">
    <iframe class="is-on" id="frame-01" title="Mesa A/B" src="01-mesa-ab/index.html"></iframe>
    <iframe id="frame-02" title="Del gesto a la mesa" data-src="02-del-gesto-a-la-mesa/index.html"></iframe>
    <iframe id="frame-03" title="Desde la mesa" data-src="03-desde-la-mesa/index.html"></iframe>
  </div>
</div>
<script>
(function () {
  var buttons = [].slice.call(document.querySelectorAll('.switch button'));
  var frames = {
    '01': document.getElementById('frame-01'),
    '02': document.getElementById('frame-02'),
    '03': document.getElementById('frame-03')
  };
  function show(id) {
    if (!frames[id]) id = '01';
    buttons.forEach(function (btn) {
      var on = btn.dataset.demo === id;
      btn.setAttribute('aria-pressed', String(on));
      btn.setAttribute('aria-selected', String(on));
      btn.tabIndex = on ? 0 : -1;
    });
    Object.keys(frames).forEach(function (key) {
      var frame = frames[key];
      var on = key === id;
      frame.classList.toggle('is-on', on);
      if (on && !frame.getAttribute('src') && frame.dataset.src) frame.src = frame.dataset.src;
    });
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
  }
  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () { show(btn.dataset.demo); });
  });
  document.querySelector('.switch').addEventListener('keydown', function (e) {
    var i = buttons.findIndex(function (b) { return b.getAttribute('aria-pressed') === 'true'; });
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      var n = buttons[(i + 1) % buttons.length];
      show(n.dataset.demo);
      n.focus();
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      var p = buttons[(i + buttons.length - 1) % buttons.length];
      show(p.dataset.demo);
      p.focus();
    }
  });
  var start = (location.hash || '#01').replace('#', '');
  show(frames[start] ? start : '01');
})();
</script>
</body>
</html>
